<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Palette</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#3b1030;--plum2:#55204a;--paper:#fffaf0;--gold:#f2a900;--pink:#e0457b;--ink:#2a0c24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--paper);font:500 16px/1.4 "Baloo 2",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 14px 30px;
background:radial-gradient(circle at 16% 20%,rgba(224,69,123,.25),transparent 38%),radial-gradient(circle at 84% 16%,rgba(242,169,0,.2),transparent 36%),linear-gradient(160deg,#2a0f2e,#4a1a3d 60%,#6b2440) fixed}
body.g{padding:6px 6px 20px}
body.g .brand,body.g .sub{display:none}
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 0}
h1{margin:0;font-size:2.2rem;font-weight:700;color:var(--gold);letter-spacing:.02em}
.sub{margin:0 0 14px;opacity:.8;text-align:center}
.card{background:var(--plum2);border-radius:18px;padding:18px;width:100%;max-width:440px}
button,input{font:inherit;border-radius:12px;border:2px solid transparent}
button{background:var(--gold);color:var(--ink);padding:8px 14px;cursor:pointer;font-weight:700}
button.alt{background:transparent;color:var(--paper);border-color:var(--paper)}
button:focus-visible,input:focus-visible,.sw:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{background:var(--paper);color:var(--ink);padding:9px 12px;width:100%;text-transform:uppercase;letter-spacing:.2em;text-align:center}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.or{text-align:center;margin:14px 0 2px;opacity:.7}
.msg{background:#7a1f3d;border-radius:12px;padding:10px 14px;margin-top:12px;display:none}
#game{display:none;width:100%;flex-direction:column;align-items:center}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap;margin-bottom:6px;min-height:40px}
.code{font-size:1.3rem;font-weight:700;letter-spacing:.2em;color:var(--gold)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#777;margin-right:6px}
.dot.on{background:#3ddc84}
.bar button{padding:4px 12px}
.layout{display:grid;grid-template-columns:68px minmax(0,1fr) 220px;gap:10px;width:100%;align-items:start;position:relative}
.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:6px}
.rail button{padding:6px 2px;font-size:.68rem;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
.rail .ic{font-size:1.4rem;line-height:1}
.rail .on{background:var(--pink);color:#fff;border-color:var(--pink)}
.rail .cur{border-color:var(--gold)}
.fly{display:none;position:absolute;left:76px;top:0;z-index:5;width:min(360px,calc(100vw - 100px));max-height:calc(100vh - 60px);overflow:auto;background:var(--plum2);border:2px solid var(--gold);border-radius:16px;padding:10px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
.fly.open{display:block}
.fly h3{margin:6px 2px;font-size:.95rem;color:var(--gold)}
.fly h3:first-child{margin-top:0}
.vars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vars button{background:var(--paper);color:var(--ink);padding:4px;border-radius:12px;font-size:.72rem;line-height:1.1}
.vars button.on{outline:3px solid var(--gold)}
.vars small{display:block;opacity:.6;font-weight:500}
.th{display:block;width:100%;height:auto;pointer-events:none}
.th .r{stroke-width:3}
main{display:flex;flex-direction:column;align-items:center;min-width:0}
.canvas{background:var(--paper);border-radius:16px;padding:6px;width:min(100%,calc(100vh - 56px));touch-action:manipulation}
#svg{display:block;width:100%;height:auto}
.r{fill:#fff;stroke:var(--plum);stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
#svg .r:hover{opacity:.85}
.panel{position:sticky;top:6px;max-height:calc(100vh - 12px);overflow:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.tools label{display:flex;align-items:center;gap:8px}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.lbl{margin:10px 0 0;font-weight:700;opacity:.85}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--paper);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--gold);outline-offset:2px}
.sw.shine{background-size:200% 100%!important;animation:sh 3s linear infinite}
@keyframes sh{from{background-position:0 0}to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){.sw.shine{animation:none}}
#custom{width:44px;height:34px;padding:0;letter-spacing:0;border-radius:10px;cursor:pointer}
.note{font-size:.85rem;opacity:.7;margin-top:10px}
.ver{margin-top:18px;font-size:10px;opacity:.45;text-align:center}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}
 .rail{flex-direction:row;overflow-x:auto;position:static}
 .rail button{min-width:64px}
 .fly{position:fixed;left:8px;right:8px;top:96px;width:auto;max-height:68vh}
 .canvas{width:100%}
 .panel{position:static;max-height:none}
 .sw{width:34px;height:34px}
}
.modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(20,5,18,.78);align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
.box{background:var(--plum2);border:2px solid var(--gold);border-radius:18px;padding:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.box h2{margin:0 0 10px;color:var(--gold);font-size:1.3rem}
.box input{text-transform:none;letter-spacing:0;text-align:left}
.box .th{background:var(--paper);border-radius:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal button{background:var(--paper);color:var(--ink);padding:6px;border-radius:12px;font-size:.8rem;line-height:1.15;text-align:center}
.gal small{display:block;opacity:.65;font-weight:500}
.view{max-width:360px;margin:0 auto 6px}
</style>
</head>
<body>
<div class="brand">
  <svg width="38" height="26" viewBox="0 0 38 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#e0457b" stroke-width="3"/><circle cx="25" cy="13" r="10" fill="none" stroke="#f2a900" stroke-width="3"/></svg>
  <h1>Colour Palette</h1>
</div>
<p class="sub">One picture, two sets of hands.</p>

<div class="card" id="lobby">
  <button id="create" style="width:100%">Create room</button>
  <p class="or">or join a room</p>
  <input id="codeIn" type="password" maxlength="7" placeholder="PASSWORD" aria-label="Room password" autocomplete="off">
  <div class="row"><button id="join" class="alt">Join room</button></div>
  <div class="msg" id="msg"></div>
</div>

<div id="game">
  <div class="bar">
    <div class="code" id="code"></div>
    <div><span class="dot" id="dot"></span><span id="st">Connecting</span></div>
    <div class="row" style="margin:0">
      <button class="alt" id="save">Save painting</button>
      <button class="alt" id="gallery">Saved paintings</button>
      <button class="alt" id="copy">Copy invite link</button>
      <button class="alt" id="leave">Leave</button>
    </div>
  </div>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Picture categories"></nav>
    <div class="fly" id="fly"></div>
    <main><div class="canvas"><svg id="svg" viewBox="-150 -150 300 300" aria-label="Colouring picture"></svg></div></main>
    <section class="panel">
      <div class="tools">
        <button class="tool alt" id="erase">&#129533; Eraser</button>
        <label>Own colour <input type="color" id="custom" value="#e0457b"></label>
        <button class="alt" id="clear">Clear picture</button>
      </div>
      <p class="lbl">Single colours</p><div class="pal" id="solid"></div>
      <p class="lbl">Two colours</p><div class="pal" id="duo"></div>
      <p class="lbl">Shining</p><div class="pal" id="shine"></div>
      <p class="note">Tap a category on the left to choose a picture. Pick a colour or the eraser, then tap the picture.</p>
    </section>
  </div>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="ver" id="ver"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,onSnapshot,deleteField,collection,addDoc,getDocs,query,orderBy,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const VERSION="v1.3";
const firebaseConfig = {
  apiKey: "AIzaSyCPPEev6QYzRCPOf5kKhD_u44v2ud9FdEA",
  authDomain: "colour-palette-29625.firebaseapp.com",
  projectId: "colour-palette-29625",
  storageBucket: "colour-palette-29625.firebasestorage.app",
  messagingSenderId: "897020325673",
  appId: "1:897020325673:web:f53b513fe0534a607d5138"
};

const ROOM="RangRez";
const $=id=>document.getElementById(id);
$("ver").textContent="Colour Palette "+VERSION;
const msg=t=>{const m=$("msg");m.textContent=t;m.style.display=t?"block":"none"};
const configured=!firebaseConfig.apiKey.startsWith("PASTE");
let db;
if(configured){db=getFirestore(initializeApp(firebaseConfig))}
else msg("Setup needed: paste your Firebase config into index.html.");

/* ---- picture building blocks ---- */
let n;
const R=(t,a)=>`<${t} class="r" data-i="${n++}" ${a}/>`;
const ring=(t,c,a,o=0,tr="")=>{let s="";for(let i=0;i<c;i++)s+=R(t,`${a} transform="${tr} rotate(${i*360/c+o})"`);return s};
const E=(cx,cy,rx,ry,x="")=>R("ellipse",`cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${x}`);
const C=(cx,cy,r)=>R("circle",`cx="${cx}" cy="${cy}" r="${r}"`);
const B=(x,y,w,h)=>R("rect",`x="${x}" y="${y}" width="${w}" height="${h}"`);
const P=p=>R("polygon",`points="${p}"`);
const bg=()=>B(-150,-150,300,300);
const rt=(a,x,y)=>`transform="rotate(${a} ${x} ${y})"`;
const LF=(x,y,a)=>E(x,y,28,10,rt(a,x,y));
const stem=(x,y,h)=>B(x-4,y,8,h);
const fl=(x,y,c,L,w,cr)=>{let s="";for(let i=0;i<c;i++)s+=R("ellipse",`cy="${-L}" rx="${w}" ry="${L*.9}" transform="translate(${x},${y}) rotate(${i*360/c})"`);return s+C(x,y,cr)};
const H=(x,y,w,h)=>B(x,y,w,h)+P(`${x-10},${y} ${x+w/2},${y-w*.5} ${x+w+10},${y}`)+B(x+w*.38,y+h*.45,w*.24,h*.55)+B(x+w*.1,y+h*.15,w*.22,h*.22)+B(x+w*.68,y+h*.15,w*.22,h*.22);
const tree=(x,y)=>B(x-6,y,12,50)+C(x,y-10,30);
const star=(x,y,r)=>P(`${x},${y-r} ${x+r*.3},${y-r*.3} ${x+r},${y} ${x+r*.3},${y+r*.3} ${x},${y+r} ${x-r*.3},${y+r*.3} ${x-r},${y} ${x-r*.3},${y-r*.3}`);
const PER=(x,y,s,boy)=>{const Q=(t,a)=>R(t,`${a} transform="translate(${x},${y}) scale(${s})"`);
  return Q("ellipse",'cy="-4" rx="27" ry="30"')+(boy?Q("rect",'x="-22" y="24" width="44" height="62"')+Q("rect",'x="-20" y="86" width="18" height="70"')+Q("rect",'x="2" y="86" width="18" height="70"'):Q("polygon",'points="-14,24 14,24 40,112 -40,112"')+Q("rect",'x="-14" y="112" width="10" height="46"')+Q("rect",'x="4" y="112" width="10" height="46"'))
  +Q("ellipse",'cx="-27" cy="55" rx="7" ry="28"')+Q("ellipse",'cx="27" cy="55" rx="7" ry="28"')+Q("circle",'r="22"')};
const f1=v=>v.toFixed(1);
const sec=(a,b,r1,r2)=>{const p=(r,t)=>`${f1(r*Math.sin(t))} ${f1(-r*Math.cos(t))}`;return R("path",`d="M${p(r2,a)}A${r2} ${r2} 0 0 1 ${p(r2,b)}L${p(r1,b)}A${r1} ${r1} 0 0 0 ${p(r1,a)}Z"`)};
const A=(k,f)=>Array.from({length:k},(_,i)=>f(i)).join("");
const hex=(x,y,r)=>P(Array.from({length:6},(_,k)=>f1(x+r*Math.cos(k*1.0472))+","+f1(y+r*Math.sin(k*1.0472))).join(" "));
const br=(x,y,c,r,w,h)=>A(c*r,i=>B(x+i%c*w,y+(i/c|0)*h,w,h));
const pine=(x,y,s)=>P(`${x},${y-40*s} ${x+14*s},${y-10*s} ${x-14*s},${y-10*s}`)+P(`${x},${y-22*s} ${x+18*s},${y+14*s} ${x-18*s},${y+14*s}`)+B(x-3*s,y+14*s,6*s,12*s);
const grass=(y,k)=>A(k,i=>P(`${-150+i*300/k},150 ${-150+(i+.5)*300/k},${y} ${-150+(i+1)*300/k},150`));
const GX=k=>-105+(k%4)*70+((k>>2)%2)*12,GY=k=>-100+(k>>2)*62;

/* ---- palace building blocks ---- */
const archP=(x,y,w,h)=>R("path",`d="M${x} ${y+h}V${y+w/2}A${w/2} ${w/2} 0 0 1 ${x+w} ${y+w/2}V${y+h}Z"`);
const AC=(c,y,w,h)=>archP(c-w/2,y,w,h);
const domeP=(x,y,r)=>R("path",`d="M${f1(x-r)} ${y}C${f1(x-r*1.4)} ${f1(y-r*.9)} ${f1(x-r*.35)} ${f1(y-r*1.15)} ${x} ${f1(y-r*1.9)}C${f1(x+r*.35)} ${f1(y-r*1.15)} ${f1(x+r*1.4)} ${f1(y-r*.9)} ${f1(x+r)} ${y}Z"`);
const fin=(x,y)=>B(x-1,y-9,2,9)+C(x,y-11,2.2);
const domeF=(x,y,r)=>domeP(x,y,r)+fin(x,+f1(y-r*1.9));
const chh=(x,y,s)=>{const t=y-3-15*s;return B(x-9*s,y-3,18*s,3)+A(3,i=>B(x-8*s+i*6.75*s,y-3-12*s,2.5*s,12*s))+B(x-10*s,t,20*s,3*s)+domeF(x,t,8*s)};
const jh=(c,y)=>B(c-11,y+5,22,3)+domeF(c,y+5,8)+B(c-9,y+8,18,22)+AC(c,y+12,10,16)+P(`${c-9},${y+30} ${c+9},${y+30} ${c},${y+40}`);
const wing=x0=>{const cx=k=>x0+8+16*k;return B(x0,22,80,74)+A(9,i=>B(x0+i*9,14,6,8))+A(20,i=>B(x0+i*4,58,2.5,3))+[0,1,3,4].map(k=>AC(cx(k),30,10,24)+AC(cx(k),33,6,19)).join("")+A(5,k=>AC(cx(k),66,12,30)+AC(cx(k),70,8,26))+jh(x0+40,26)+chh(x0+8,14,1)+chh(x0+72,14,1)};
const tower=x=>B(x-7,-48,14,144)+A(5,i=>B(x-8,-30+i*28,16,3))+A(4,i=>AC(x,-24+i*28,6,16))+B(x-10,-52,20,4)+B(x-6,-60,12,8)+domeF(x,-60,7);
const cloud=(x,y)=>E(x,y,20,7)+E(x-12,y-5,11,8)+E(x+8,y-7,12,9);
const pathway=()=>A(9,t=>{const r=t/3|0,k=t%3,y0=117+r*11,y1=y0+11,h0=26+(y0-117)*.55,h1=26+(y1-117)*.55,a=(h,j)=>f1(-h+j*2*h/3);return P(`${a(h0,k)},${y0} ${a(h0,k+1)},${y0} ${a(h1,k+1)},${y1} ${a(h1,k)},${y1}`)});
const bed=s=>A(7,i=>C(s*(62+i*13),108,6))+A(5,i=>fl(s*(52+i*20),124,6,6,3,3))+A(4,i=>fl(s*(62+i*20),140,6,6,3,3));
/* ---- bungalow scene building blocks ---- */
const win=(c,y,w,h)=>B(c-w/2-3,y,2.5,h)+B(c+w/2+.5,y,2.5,h)+B(c-w/2,y,w,h)+A(4,i=>B(c-w/2+1+(i%2)*(w/2-.5),y+1+(i>>1)*(h/2-.5),w/2-1.5,h/2-1.5))+B(c-w/2-2,y+h,w+4,2.5)+B(c-w/2-1.5,y-3,w+3,2.5);
const car=(x,y,s)=>{const X=v=>f1(x+v*s),Y=v=>f1(y+v*s),W=v=>f1(v*s);
  return R("rect",`x="${X(0)}" y="${Y(10)}" width="${W(60)}" height="${W(12)}" rx="${W(3)}"`)
  +P(`${X(12)},${Y(10)} ${X(20)},${Y(0)} ${X(42)},${Y(0)} ${X(50)},${Y(10)}`)
  +P(`${X(15)},${Y(9)} ${X(21)},${Y(2)} ${X(29)},${Y(2)} ${X(29)},${Y(9)}`)
  +P(`${X(31)},${Y(9)} ${X(31)},${Y(2)} ${X(41)},${Y(2)} ${X(47)},${Y(9)}`)
  +B(X(30),Y(13),W(5),W(2))+E(X(57),Y(14),W(2.5),W(3))+E(X(3),Y(14),W(2.5),W(3))
  +C(X(14),Y(22),W(7))+C(X(14),Y(22),W(3.5))+C(X(46),Y(22),W(7))+C(X(46),Y(22),W(3.5))};
const tree2=(x,y,s)=>B(x-5*s,y,10*s,40*s)+B(x-5*s,y+14*s,10*s,3*s)+C(x,y-12*s,20*s)+C(x-17*s,y-2*s,15*s)+C(x+17*s,y-2*s,15*s)+C(x-9*s,y-28*s,14*s)+C(x+9*s,y-28*s,14*s)
  +A(8,i=>C(f1(x+(((i*37)%36)-18)*s),f1(y-12*s+(((i*23)%34)-17)*s),2.5*s));
const palm=(x,y)=>{const p=i=>x+i*.8;return A(5,i=>P(`${f1(p(i)-4)},${y-i*9} ${f1(p(i)+4)},${y-i*9} ${f1(p(i+1)+3.5)},${y-(i+1)*9} ${f1(p(i+1)-3.5)},${y-(i+1)*9}`))+ring("ellipse",8,'cy="-14" rx="4.5" ry="14"',0,`translate(${x+4},${y-45})`)+C(x+1,y-42,3)+C(x+7,y-42,3)+C(x+4,y-38,3)};
const swing=(x,y)=>P(`${x-27},${y} ${x-23},${y} ${x-21},${y-34} ${x-25},${y-34}`)+P(`${x+27},${y} ${x+23},${y} ${x+21},${y-34} ${x+25},${y-34}`)+B(x-27,y-37,54,4)+B(x-10,y-33,1.8,24)+B(x+8,y-33,1.8,24)+B(x-13,y-9,25,4);
const lamp=(x,y)=>B(x-1.2,y-24,2.4,24)+P(`${x-5},${y-24} ${x+5},${y-24} ${x+3},${y-34} ${x-3},${y-34}`)+C(x,y-37,2.5);
const bricks=(x0,x1,n)=>A(2*n,i=>{const w=(x1-x0)/n;return B(f1(x0+(i%n)*w),110+(i/n|0)*7,f1(w),7)})+B(x0-1,107,x1-x0+2,3);
const pillar=x=>B(x,100,8,24)+B(x-1,97,10,3)+C(x+4,94,3);
const bungalow=()=>bg()
 +C(-112,-115,15)+ring("polygon",14,'points="-3,-21 0,-33 3,-21"',0,"translate(-112,-115)")
 +cloud(-45,-128)+cloud(60,-112)+cloud(118,-72)
 +A(3,i=>{const x=25+i*14,y=-70-(i%2)*10;return P(`${x},${y} ${x+6},${y-4} ${x+12},${y} ${x+6},${y-2}`)})
 +A(12,i=>C(-150+i*27,32,15))
 +B(-150,48,300,80)
 +tree2(-118,14,1)+tree2(118,14,1)
 /* garage wing */
 +A(2,r=>{const yT=-8+r*11,yB=yT+11,l=y=>32-(y+8)*12/22,rr=y=>85+(y+8)*12/22,n=5+r,p=(y,k)=>f1(l(y)+(rr(y)-l(y))*k/n);return A(n,k=>P(`${p(yT,k)},${yT} ${p(yT,k+1)},${yT} ${p(yB,k+1)},${yB} ${p(yB,k)},${yB}`))})
 +P("30,-11 87,-11 85,-8 32,-8")+B(25,14,67,48)+B(18,14,81,3)+A(3,i=>E(45+i*13,22,4,3.5))
 +B(34,28,50,34)+A(16,i=>B(35+(i%4)*12.2,29+(i>>2)*8.2,11,7))+C(29,34,2)+C(89,34,2)
 /* main house */

const SHINE=[["Gold","#f2a900","#a86b00"],["Silver","#c9ced6","#6b7280"],["Rose gold","#f4a6a0","#b76e79"],["Copper","#e07a3f","#8a3b12"],["Emerald","#2ecc71","#0b6b3a"],["Sapphire","#4f8cff","#1b3a8a"],["Ruby","#ff4d6d","#8a1030"],["Amethyst","#b57cff","#4b2a8a"]];
const DEFS="<defs>"+DUO.map((d,i)=>`<linearGradient id="d${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${d[1]}"/><stop offset="1" stop-color="${d[2]}"/></linearGradient>`).join("")
+SHINE.map((d,i)=>`<linearGradient id="s${i}" x1="-1" y1="0" x2="0" y2="0.4" spreadMethod="reflect"><stop offset="0" stop-color="${d[2]}"/><stop offset=".3" stop-color="${d[1]}"/><stop offset=".5" stop-color="#fff"/><stop offset=".7" stop-color="${d[1]}"/><stop offset="1" stop-color="${d[2]}"/><animate attributeName="x1" values="-1;1;-1" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2;0" dur="4s" repeatCount="indefinite"/></linearGradient>`).join("")+"</defs>";
const paint=v=>!v?"#fff":v[0]=="#"?v:`url(#${v})`;

/* ---- state ---- */
let room=null,ref=null,unsub=null,fig=DEF,cat="Mandalas",fills={},cur="#e0457b",shownFig=null;
const svg=$("svg"),fly=$("fly");

function pick(v,b){cur=v;document.querySelectorAll(".sw,.tool,#custom").forEach(x=>x.classList.remove("on"));b.classList.add("on")}
function sw(val,bg,label,cls){const b=document.createElement("button");b.className="sw "+(cls||"");b.style.background=bg;b.title=label;b.setAttribute("aria-label",label);b.onclick=()=>pick(val,b);return b}
SOLID.forEach((c,i)=>{const b=sw(c,c,"Colour "+(i+1));if(!i)b.classList.add("on");$("solid").append(b)});
DUO.forEach((d,i)=>$("duo").append(sw("d"+i,`linear-gradient(135deg,${d[1]},${d[2]})`,d[0]+", two colours")));
SHINE.forEach((d,i)=>$("shine").append(sw("s"+i,`linear-gradient(110deg,${d[2]},${d[1]} 35%,#fff 50%,${d[1]} 65%,${d[2]})`,d[0]+", shining","shine")));
$("erase").onclick=function(){pick("",this)};
$("custom").oninput=e=>pick(e.target.value,e.target);

/* ---- category rail (left) and picture list (opens on tap, hides after choosing) ---- */
function buildRail(){
  const rl=$("rail"),open=fly.classList.contains("open");rl.innerHTML="";
  Object.keys(CAT).forEach(k=>{const b=document.createElement("button");
    b.className="alt"+(open&&k===cat?" on":(!open&&k===fig.split("/")[0]?" cur":""));
    b.innerHTML=`<span class="ic">${CAT[k].i}</span>${k}`;
    b.onclick=e=>{e.stopPropagation();if(open&&k===cat)fly.classList.remove("open");else{cat=k;buildFly();fly.classList.add("open")}buildRail()};rl.append(b)});
}
function buildFly(){
  fly.innerHTML="";
  const tm=c=>{const m=c/14;return m<5?Math.max(1,Math.round(m)):Math.round(m/5)*5};
  const grp=(title,obj)=>{if(!Object.keys(obj).length)return;
    const items=Object.keys(obj).map(k=>{const id=cat+"/"+k,s=draw(id);return{k,id,s,cnt:(s.match(/class="r"/g)||[]).length}});
    const t=items.map(x=>tm(x.cnt)),lo=Math.min(...t),hi=Math.max(...t);
    const h=document.createElement("h3");h.textContent=title+" ("+(lo===hi?lo:lo+" to "+hi)+" minutes)";fly.append(h);
    const g=document.createElement("div");g.className="vars";
    items.forEach(x=>{const b=document.createElement("button");if(x.id===fig)b.className="on";
      b.innerHTML=`<svg class="th" viewBox="-150 -150 300 300">${x.s}</svg>${x.k}<small>${x.cnt} parts<br>about ${tm(x.cnt)} min</small>`;b.onclick=()=>choose(x.id);g.append(b)});fly.append(g)};
  grp("Detailed",CAT[cat].d);grp("Quick",CAT[cat].s);
}
function choose(id){
  if(!room||id===fig)return;
  if(Object.keys(fills).length&&!confirm("Start a new picture? This clears the colours for both of you."))return;
  updateDoc(ref,{fig:id,fills:{}}).catch(()=>setStatus(false,"Offline"));
  fly.classList.remove("open");buildRail();svg.scrollIntoView({behavior:"smooth",block:"center"});
}
document.addEventListener("click",e=>{if(!e.target.closest(".fly,.rail")&&fly.classList.contains("open")){fly.classList.remove("open");buildRail()}});

function render(){
  if(shownFig!==fig){svg.innerHTML=DEFS+draw(fig);shownFig=fig;cat=fig.split("/")[0];buildRail()}
  svg.querySelectorAll(".r").forEach(e=>e.style.fill=paint(fills[e.dataset.i]));
}
svg.addEventListener("click",e=>{
  const t=e.target.closest(".r");if(!t||!room)return;
  const i=t.dataset.i,off=()=>setStatus(false,"Offline");
  if(cur===""){delete fills[i];t.style.fill="#fff";updateDoc(ref,{["fills."+i]:deleteField()}).catch(off)}
  else{fills[i]=cur;t.style.fill=paint(cur);updateDoc(ref,{["fills."+i]:cur}).catch(off)}
});

function setStatus(on,t){$("dot").classList.toggle("on",on);$("st").textContent=t}
const codeGen=()=>Array.from({length:5},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.random()*31|0]).join("");

function enter(code){
  room=code;ref=doc(db,"rooms",code);
  $("lobby").style.display="none";$("game").style.display="flex";document.body.classList.add("g");$("code").textContent="";
  shownFig=null;
  unsub=onSnapshot(ref,s=>{
    if(!s.exists())return;
    const d=s.data();fig=valid(d.fig);fills=d.fills||{};render();setStatus(true,"Live");
  },()=>setStatus(false,"Offline"));
}
async function create(){
  if(!configured)return msg("Add your Firebase config first.");
  if($("codeIn").value.trim().toUpperCase()!==ROOM.toUpperCase())return msg("Enter the room password first.");
  try{const r=doc(db,"rooms",ROOM);const s=await getDoc(r);if(!s.exists())await setDoc(r,{fig:DEF,fills:{},made:Date.now()});enter(ROOM)}
  catch(e){msg("Could not create the room. Check that Firestore is enabled and in test mode.")}
}
async function join(){
  if(!configured)return msg("Add your Firebase config first.");
  if($("codeIn").value.trim().toUpperCase()!==ROOM.toUpperCase())return msg("Wrong password. Check it and try again.");
  try{const s=await getDoc(doc(db,"rooms",ROOM));s.exists()?enter(ROOM):msg("No room yet. Tap Create room first.")}
  catch(e){msg("Could not join. Check your internet connection.")}
}
$("create").onclick=create;$("join").onclick=join;
$("codeIn").addEventListener("keydown",e=>e.key==="Enter"&&join());
$("clear").onclick=()=>room&&confirm("Clear all colours for both of you?")&&updateDoc(ref,{fills:{}});
$("leave").onclick=()=>{unsub&&unsub();room=null;shownFig=null;fly.classList.remove("open");document.body.classList.remove("g");history.replaceState(null,"",location.pathname);$("game").style.display="none";$("lobby").style.display="block";setStatus(false,"Connecting")};
$("copy").onclick=async()=>{const u=location.origin+location.pathname+"?room="+room;
  try{await navigator.clipboard.writeText(u);$("copy").textContent="Link copied"}catch{prompt("Copy this link:",u)}
  setTimeout(()=>$("copy").textContent="Copy invite link",1800)};

/* ---- save painting and gallery ---- */
const modal=$("modal"),box=$("box");
const closeModal=()=>modal.classList.remove("open");
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const when=t=>new Date(t).toLocaleString([],{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
function thumb(id,f){const d=document.createElement("div");d.innerHTML=`<svg class="th" viewBox="-150 -150 300 300">${draw(valid(id))}</svg>`;
  d.querySelectorAll(".r").forEach(e=>e.style.fill=paint(f[e.dataset.i]));return d.firstChild}
function btn(t,cls,fn){const b=el("button",cls,t);b.onclick=fn;return b}
function openSave(){
  if(!room)return;
  box.innerHTML="";modal.classList.add("open");
  box.append(el("h2",null,"Save painting"));
  if(!Object.keys(fills).length){
    box.append(el("p",null,"Colour something first, then save it."));
    const r=el("div","row");r.append(btn("Close","alt",closeModal));box.append(r);return}
  const v=el("div","view");v.append(thumb(fig,fills));box.append(v);
  box.append(el("p","lbl","Name your painting"));
  const inp=el("input");inp.id="pname";inp.maxLength=40;inp.placeholder="For example: Our palace";inp.value=fig.split("/")[1];box.append(inp);
  const m=el("div","msg");box.append(m);
  const save=async()=>{
    const name=inp.value.trim();if(!name){m.textContent="Please give your painting a name.";m.style.display="block";return}
    try{await addDoc(collection(db,"rooms",room,"paintings"),{name,fig,fills:{...fills},savedAt:Date.now()});
      box.innerHTML="";box.append(el("h2",null,"Saved"),el("p",null,"\u201c"+name+"\u201d was saved on "+when(Date.now())+"."));
      const r=el("div","row");r.append(btn("Close","alt",closeModal),btn("See saved paintings",null,openGallery));box.append(r)}
    catch(e){m.textContent="Could not save. Check your internet connection and that Firestore is open to this room.";m.style.display="block"}};
  const r=el("div","row");r.append(btn("Save",null,save),btn("Cancel","alt",closeModal));box.append(r);
  inp.addEventListener("keydown",e=>e.key==="Enter"&&save());inp.focus();inp.select();
}
async function openGallery(){
  if(!room)return;
  box.innerHTML="";modal.classList.add("open");
  box.append(el("h2",null,"Saved paintings"),el("p","note","Loading..."));
  let list;
  try{const qs=await getDocs(query(collection(db,"rooms",room,"paintings"),orderBy("savedAt","desc")));list=qs.docs.map(d=>({id:d.id,...d.data()}))}
  catch(e){box.innerHTML="";box.append(el("h2",null,"Saved paintings"),el("p",null,"Could not load. Check your internet connection."));const r=el("div","row");r.append(btn("Close","alt",closeModal));box.append(r);return}
  box.innerHTML="";box.append(el("h2",null,"Saved paintings"));
  if(!list.length)box.append(el("p",null,"Nothing saved yet. Finish a painting and tap Save painting."));
  else{const g=el("div","gal");
    list.forEach(p=>{const b=el("button");b.append(thumb(p.fig,p.fills||{}),el("div",null,p.name),el("small",null,when(p.savedAt)));b.onclick=()=>showOne(p);g.append(b)});
    box.append(g)}
  const r=el("div","row");r.append(btn("Close","alt",closeModal));box.append(r);
}
function showOne(p){
  box.innerHTML="";box.append(el("h2",null,p.name),el("p","note","Painted and saved on "+when(p.savedAt)));
  const v=el("div","view");v.append(thumb(p.fig,p.fills||{}));box.append(v);
  const r=el("div","row");
  r.append(btn("Back","alt",openGallery),btn("Delete","alt",async()=>{
    if(!confirm("Delete \u201c"+p.name+"\u201d for both of you?"))return;
    try{await deleteDoc(doc(db,"rooms",room,"paintings",p.id))}catch(e){}openGallery()}),btn("Close","alt",closeModal));
  box.append(r);
}
$("save").onclick=openSave;$("gallery").onclick=openGallery;

const q=new URLSearchParams(location.search).get("room");
if(q){$("codeIn").value=q.toUpperCase();if(configured)join()}
</script>
</body>
</html>
